name: uml-alpine

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'Custom command to run inside Alpine (UML guest)'
        required: false
        default: 'wget -q -O - http://example.com > /tmp/example.html && echo NETWORK-OK: got $(wc -c < /tmp/example.html) bytes from example.com'
        type: string
      timeout_sec:
        description: 'Run the command for up to this many seconds (0 = no limit)'
        required: false
        default: '0'
        type: string

jobs:
  uml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          for i in $(seq 1 6); do
            sudo apt-get install -y bc bison flex libssl-dev libelf-dev wget xz-utils cpio jq dwarves e2fsprogs && break
            sleep 20
          done

      - name: Resolve custom command and time limit
        env:
          CMD_IN: ${{ inputs.cmd }}
          TLIM_IN: ${{ inputs.timeout_sec }}
        run: |
          CMD="$CMD_IN"
          TLIM="$TLIM_IN"
          [ -z "$CMD" ] && CMD='wget -q -O - http://example.com > /tmp/example.html && echo NETWORK-OK: got $(wc -c < /tmp/example.html) bytes from example.com'
          [ -z "$TLIM" ] && TLIM=0
          echo "CMDB64=$(printf '%s' "$CMD" | base64 -w0)" >> "$GITHUB_ENV"
          echo "TLIM=$TLIM" >> "$GITHUB_ENV"
          if [ "$TLIM" = "0" ]; then
            echo "::notice::will run /run.sh (or custom cmd) in UML guest with no time limit"
          else
            echo "::notice::will run /run.sh (or custom cmd) in UML guest for up to ${TLIM}s"
          fi

      - name: Resolve latest stable kernel
        run: |
          curl -fsSL https://www.kernel.org/releases.json -o releases.json
          KVER=$(jq -r '.latest_stable.version' releases.json)
          KURL=$(jq -r --arg v "$KVER" '.releases[] | select(.version==$v) | .source' releases.json | head -1)
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KURL=$KURL" >> "$GITHUB_ENV"

      - name: Download Linux kernel source
        run: |
          curl -fsSL "$KURL" | tar -xJ
          mv "linux-$KVER" linux-src

      - name: Build Alpine rootfs image (img)
        run: |
          set -e
          AVER=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/ | grep -oP 'alpine-minirootfs-\K[0-9.]+(?=-x86_64\.tar\.gz)' | head -1)
          echo "AVER=$AVER" >> "$GITHUB_ENV"

          IMG=alpine.img
          MNT=/mnt/alpineimg
          dd if=/dev/zero of="$IMG" bs=1M count=0 seek=2048
          mkfs.ext4 -F "$IMG"
          sudo mkdir -p "$MNT"
          sudo mount -o loop "$IMG" "$MNT"

          curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/alpine-minirootfs-$AVER-x86_64.tar.gz" | sudo tar -xz -C "$MNT"
          sudo mkdir -p "$MNT/proc" "$MNT/sys" "$MNT/dev" "$MNT/tmp"

          echo '' | base64 -d > /tmp/init_alpine.sh
          sudo install -m 0755 /tmp/init_alpine.sh "$MNT/init"

          # install repo-provided run.sh if present
          if [ -f run.sh ]; then
            sudo install -m 0755 run.sh "$MNT/run.sh"
          fi

          # ensure basic device nodes exist for early boot
          sudo mknod -m 600 "$MNT/dev/console" c 5 1 2>/dev/null || true
          sudo mknod -m 666 "$MNT/dev/tty0" c 4 0 2>/dev/null || true
          sudo mknod -m 666 "$MNT/dev/null" c 1 3 2>/dev/null || true
          sudo mknod -m 666 "$MNT/dev/zero" c 1 5 2>/dev/null || true

          sync
          sudo umount "$MNT"
          ls -lh "$IMG"

      - name: Build UML kernel (ubd img root)
        run: |
          cd linux-src
          make ARCH=um defconfig
          scripts/config --file .config \
            -e UML_NET -e UML_NET_VECTOR -e SMP -e UBD -e BLK_DEV_UBD \
            -e EXT4_FS -e EXT4_USE_FOR_EXT2 \
            -e PROC_FS -e SYSFS -e TMPFS -e DEVTMPFS \
            --set-val NR_CPUS 8 \
            -d DEBUG_INFO -d DEBUG_KERNEL -d DEBUG_FS -d KCOV -d KGDB \
            -e CC_OPTIMIZE_FOR_PERFORMANCE
          make ARCH=um olddefconfig
          make ARCH=um -j"$(nproc)"
          ls -lh linux
          grep -E '^CONFIG_UBD=|^CONFIG_EXT4_FS=|^CONFIG_UML_NET_VECTOR=|^CONFIG_SMP=|^CONFIG_NR_CPUS=' .config || true

      - name: Set up host veth pair and NAT
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo ip link add veth0 type veth peer name veth0p
          sudo ip addr add 10.0.2.1/24 dev veth0
          sudo ip link set veth0 up
          sudo ip link set veth0p up
          sudo iptables -t nat -A POSTROUTING -s 10.0.2.0/24 -o eth0 -j MASQUERADE
          sudo iptables -A FORWARD -i veth0 -o eth0 -j ACCEPT
          sudo iptables -A FORWARD -i eth0 -o veth0 -m state --state RELATED,ESTABLISHED -j ACCEPT
          ip -4 addr show veth0

      - name: Boot Alpine inside UML (img) and run custom command
        timeout-minutes: 360
        run: |
          set -e
          # Random guest RAM: 3.0-3.5 GiB on a 64 MiB grid.
          MIN=3072; MAX=3584; STEP=64
          N=$(( (MAX - MIN) / STEP + 1 ))
          MEM=$(( MIN + (RANDOM % N) * STEP ))
          NCPU=$(nproc)
          UMID=umlrun
          UMID_DIR="/root/.uml/$UMID"
          echo "::notice::allocating ${MEM}M guest RAM (random 3072-3584M, 64M grid), ncpus=${NCPU}, tlim=${TLIM} (img root, optimized)"

          # Back UML guest RAM with tmpfs (try hugepages) and pin CPUs for better memory locality/perf
          sudo mkdir -p /mnt/uml-mem
          sudo mount -t tmpfs -o "size=$((MEM + 512))M,huge=within_size" tmpfs /mnt/uml-mem 2>/dev/null || \
            sudo mount -t tmpfs -o "size=$((MEM + 512))M" tmpfs /mnt/uml-mem
          MAXCPU=$((NCPU-1))
          CPUSET="0-${MAXCPU}"

          IMG_PATH="$GITHUB_WORKSPACE/alpine.img"
          UML_CMD="./linux-src/linux umid=$UMID mem=${MEM}M ncpus=${NCPU} seccomp=on quiet loglevel=4 mitigations=off \
            ubd0=$IMG_PATH root=/dev/ubda rw init=/init \
            con0=fd:0,fd:1 cmdb64=$CMDB64 tlim=$TLIM"

          if [ "$TLIM" = "0" ]; then
            sudo env TMPDIR=/mnt/uml-mem TMP=/mnt/uml-mem taskset -c "$CPUSET" stdbuf -oL -eL $UML_CMD > uml.log 2>&1 &
          else
            sudo env TMPDIR=/mnt/uml-mem TMP=/mnt/uml-mem taskset -c "$CPUSET" stdbuf -oL -eL timeout $((TLIM + 180)) $UML_CMD > uml.log 2>&1 &
          fi
          UMLPID=$!

          # Wait for mconsole socket and configure vector network device via mconsole.
          MCSOCK=""
          for i in $(seq 1 90); do
            if sudo test -S "$UMID_DIR/mconsole"; then
              MCSOCK="$UMID_DIR/mconsole"
            else
              MCSOCK=$(grep -oP 'mconsole initialized on \K\S+' uml.log 2>/dev/null | head -1 || true)
            fi
            if [ -n "$MCSOCK" ] && sudo test -S "$MCSOCK"; then
              echo "mconsole socket: $MCSOCK"
              echo '' | base64 -d | sudo python3 - "$MCSOCK"
              break
            fi
            if [ $((i % 10)) -eq 0 ]; then echo "waiting for mconsole... (${i}s) sock='${MCSOCK}'"; fi
            sleep 1
          done
          if [ -z "$MCSOCK" ] || ! sudo test -S "$MCSOCK"; then echo "warning: mconsole socket not found/ready"; fi

          wait $UMLPID || true
          echo "----- UML boot log -----"
          tail -120 uml.log
          grep -q '=== ALPINE BOOTED INSIDE UML' uml.log || { echo '::error::UML never booted Alpine'; exit 1; }
          grep -q 'cmd exit code: 0' uml.log || { echo '::error::custom command finished with a non-zero status'; exit 1; }
          grep -q 'Power down' uml.log || { echo '::error::guest did not power down cleanly'; exit 1; }
          echo "::notice::custom command ran inside Alpine $AVER on UML kernel $KVER over veth+NAT with ${MEM}M guest RAM, ncpus=${NCPU} (img root)"
